name: phar

on:
  # On every push to the default branch as well as on a tag, so that the badge
  # has something to report — a workflow that only runs on a tag leaves its badge
  # grey until somebody cuts a release, which is a badge nobody can read. It also
  # means a broken archive build is found long before a release needs one.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Building on a pull request catches a broken build before it reaches the
  # default branch, without spending a run on every push.
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'composer.json'
      - 'composer.lock'
      - 'tools/**'
      - '.github/workflows/phar.yml'

concurrency:
  group: phar-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. The one step that writes is the release below, and it
# says so itself rather than the whole workflow holding write access it does not
# need: `contents: write` on a job that only reads a repository is a wider blast
# radius than the job needs.
permissions:
  contents: read

jobs:
  build:
    name: build mdword.phar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # One version, so the artifact is the same file however many times it is
          # built. The phar carries no dev dependencies, so the test framework's
          # floor of 8.4 is irrelevant here; 8.3 is the oldest that builds it.
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # The archive says when it was built, and the whole point of that is that
      # the answer is the commit rather than the runner. `SOURCE_DATE_EPOCH` is
      # what tools/build-phar.php stamps every entry with, and the commit's own
      # date is the most meaningful instant a build could be given.
      - name: Stamp the archive with the commit's date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # The build script drives the tool's own class to read its name and version,
      # so it needs the autoloader even though the archive's dependencies are
      # resolved separately below. Runtime only: the test framework needs PHP 8.4
      # and this job deliberately runs on 8.3, which is the oldest version that can
      # build the archive.
      - name: Install the autoloader
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Build
        # The script re-runs itself with phar.readonly off, so the flag in
        # composer.json is only needed when it is called directly.
        run: composer build:phar

      # What the archive will actually be asked to run on, asked of the manifest
      # and lock file that produced it rather than of the project's own. The
      # test matrix reports what the library works on; this reports what the
      # artifact needs, which is a different question and the one a user hitting
      # a missing extension actually asks. It also says which package wanted
      # what, so a platform failure names its cause instead of leaving it to be
      # inferred.
      - name: The artifact's floor
        run: |
          php -v
          composer check-platform-reqs --no-dev --working-dir=build/deps

      # Built twice and compared, because a build that says it is reproducible
      # and is not is worse than one that says nothing: the checksum in the
      # release notes is a claim about the artifact, and this is where the claim
      # is checked. The two builds share a runner, a PHP and a zlib, so what this
      # proves is that the build script introduces nothing of its own — a
      # difference between two different PHP builds would be zlib's, not this
      # repository's.
      - name: The build is reproducible
        run: |
          first=$(sha256sum build/mdword.phar | cut -d' ' -f1)
          composer build:phar
          second=$(sha256sum build/mdword.phar | cut -d' ' -f1)
          echo "first  $first"
          echo "second $second"
          if [ "$first" != "$second" ]; then
            echo "::error::Two builds of the same commit produced different bytes."
            exit 1
          fi

      # Everything the checks write goes in `tmp/`, which is the project's rule
      # for scratch files. Writing them into the repository root leaves an
      # untracked `check.md` and `check.docx` behind on every run.
      - name: Run the phar on its own
        run: |
          mkdir -p tmp
          ./build/mdword.phar --version
          printf '# Built\n\n| A | B |\n| --- | --- |\n| 1 | 2 |\n' > tmp/check.md
          ./build/mdword.phar to-docx tmp/check.md -o tmp/check.docx
          ./build/mdword.phar to-markdown tmp/check.docx -o tmp/round-trip.md
          grep -q '# Built' tmp/round-trip.md

      # One file, and nothing else beside it. A `build/` full of staging
      # directories would turn the download into a tarball and defeat the point.
      - name: Upload the phar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdword-phar
          path: build/mdword.phar
          if-no-files-found: error
          retention-days: 30

      - name: Attach the phar to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        # Publishing a release needs `contents: write`, and the workflow-level
        # grant is only read. Without this the first release fails with
        # "403 Resource not accessible by integration" — which is a good way to
        # find out about it on the day, and a bad way to find out at all.
        permissions:
          contents: write
        with:
          files: build/mdword.phar
          # The phar's own version is the single source of truth for what this
          # is, so a tag that disagrees with it is a mistake worth failing on.
          fail_on_unmatched_files: true
